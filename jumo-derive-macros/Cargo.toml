[package]
name = "jumo-derive-macros"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Proc-macro implementation for jumo-derive: generates JumoItem trait impls from #[derive(Jumo)]"
readme = "../README.md"
keywords = ["jumo", "derive", "metadata", "proc-macro"]
categories = ["development-tools::procedural-macro-helpers"]

[lib]
proc-macro = true

[dependencies]
syn = "2"
quote = "1"
proc-macro2 = "1"
