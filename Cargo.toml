[workspace]
members = [".", "jumo-derive-macros"]

[package]
name = "jumo-derive"
version = "0.1.5" #@gxl:set(version)
edition = "2021"
description = "Proc-macro crate for annotating Rust types with reviewed Jumo model metadata"
license = "Apache-2.0"
repository = "https://github.com/jumo-design/jumo-derive"
readme = "README.md"
keywords = ["jumo", "derive", "metadata", "proc-macro", "annotation"]
categories = ["development-tools::procedural-macro-helpers"]

[dependencies]
jumo-derive-macros = { version = "0.1.1", path = "jumo-derive-macros" }
