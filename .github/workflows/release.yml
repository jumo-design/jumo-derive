name: Release

on:
  push:
    tags:
      - "v*.*.*"
      - "v*.*.*-dryrun"

jobs:
  create-release:
    name: Create GitHub Release
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Create GitHub Release
        # `-dryrun` tags exist to exercise the publish steps below without
        # publishing, so they must not produce a Release. The guard belongs here
        # rather than on the job: `publish-crate` needs this job, and a skipped
        # job would skip the dry-run publications too.
        if: ${{ !endsWith(github.ref, '-dryrun') }}
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  publish-crate:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    needs: create-release
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Cargo login
        if: ${{ !endsWith(github.ref, '-dryrun') }}
        run: echo "${{ secrets.CRATES_IO_TOKEN }}" | cargo login
      - name: Check whether jumo-derive-macros is already on crates.io
        id: macros
        run: |
          version=$(grep -m1 '^version' jumo-derive-macros/Cargo.toml | cut -d'"' -f2)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if curl -sSf https://index.crates.io/ju/mo/jumo-derive-macros | grep -q "\"vers\":\"$version\""; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Cargo publish jumo-derive-macros (dry run)
        if: ${{ endsWith(github.ref, '-dryrun') }}
        run: cargo publish -p jumo-derive-macros --dry-run
      - name: Cargo publish jumo-derive-macros
        if: ${{ !endsWith(github.ref, '-dryrun') && steps.macros.outputs.publish == 'true' }}
        run: cargo publish -p jumo-derive-macros
      - name: Skip jumo-derive-macros (version already published)
        if: ${{ !endsWith(github.ref, '-dryrun') && steps.macros.outputs.publish == 'false' }}
        run: echo "jumo-derive-macros ${{ steps.macros.outputs.version }} is already on crates.io, skipping"
      - name: Cargo publish jumo-derive (dry run)
        if: ${{ endsWith(github.ref, '-dryrun') }}
        run: cargo publish -p jumo-derive --dry-run
      - name: Cargo publish jumo-derive
        if: ${{ !endsWith(github.ref, '-dryrun') }}
        run: cargo publish -p jumo-derive
